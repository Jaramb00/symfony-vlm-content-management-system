parameters:
    app.upload_dir: '%kernel.project_dir%/public/uploads'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # Svaki servis/handler s konstruktorskim argumentom "string $uploadDir"
            # automatski dobiva ovu vrijednost
            string $uploadDir: '%app.upload_dir%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\ApiService:
        arguments:
            $anthropicApiKey: '%env(ANTHROPIC_API_KEY)%'
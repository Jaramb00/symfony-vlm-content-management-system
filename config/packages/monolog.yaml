monolog:
    channels:
        - deprecation
        - ai_api   # zaseban kanal za sve Anthropic API pozive

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!ai_api"]
            # AI pozivi idu u vlastitu rotating datoteku — lako za pratiti odvojeno od framework šuma
            ai_api:
                type: rotating_file
                path: "%kernel.logs_dir%/ai_api.log"
                level: info
                max_files: 10
                channels: ["ai_api"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            # U produkciji (Docker) sve na stderr kao JSON — container platforme to same skupljaju
            ai_api:
                type: stream
                path: php://stderr
                level: info
                channels: ["ai_api"]
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]